<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flashcards - Minimal Working</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: #0f1117;
            color: #e8edf5;
            padding: 30px 20px;
            max-width: 700px;
            margin: 0 auto;
        }
        h1 { font-size: 2rem; margin-bottom: 24px; color: #a5b4fc; }
        .card {
            background: #1a1d27;
            padding: 24px;
            border-radius: 16px;
            margin-bottom: 20px;
            border: 1px solid #2a2d3a;
        }
        input, select {
            width: 100%;
            padding: 12px 16px;
            margin-bottom: 12px;
            background: #0f1117;
            border: 1px solid #2a2d3a;
            border-radius: 10px;
            color: #e8edf5;
            font-size: 1rem;
        }
        input:focus, select:focus {
            outline: 2px solid #4f46e5;
            border-color: transparent;
        }
        button {
            padding: 12px 28px;
            background: #4f46e5;
            color: white;
            border: none;
            border-radius: 60px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.2s;
        }
        button:hover { background: #6366f1; transform: scale(1.02); }
        .delete-btn {
            background: #dc2626;
            padding: 6px 16px;
            font-size: 0.8rem;
        }
        .delete-btn:hover { background: #ef4444; }
        .card-item {
            background: #1a1d27;
            padding: 16px 20px;
            margin-bottom: 8px;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 4px solid #4f46e5;
        }
        .card-item strong { color: #a5b4fc; }
        .empty-state {
            text-align: center;
            padding: 40px 0;
            color: #6b7280;
        }
        .badge {
            background: #4f46e5;
            padding: 2px 12px;
            border-radius: 40px;
            font-size: 0.7rem;
            color: white;
        }
        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: #1a1d27;
            padding: 16px 24px;
            border-radius: 12px;
            border: 1px solid #2a2d3a;
            color: #e8edf5;
            display: none;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .toast.show { display: block; animation: fadeIn 0.3s; }
        @keyframes fadeIn { from { opacity:0; transform: translateY(10px); } to { opacity:1; transform: translateY(0); } }
    </style>
</head>
<body>

    <h1>📚 Flashcards</h1>

    <!-- ADD CARD -->
    <div class="card">
        <h3 style="margin-bottom:16px;">➕ New Card</h3>
        <input id="frontInput" placeholder="Front (e.g. Question)" />
        <input id="backInput" placeholder="Back (e.g. Answer)" />
        <button onclick="addCard()">Save Card</button>
    </div>

    <!-- CARD LIST -->
    <div class="card">
        <h3 style="margin-bottom:16px;">📋 Your Cards</h3>
        <div id="cardList">
            <div class="empty-state">No cards yet. Add your first one above!</div>
        </div>
    </div>

    <!-- TOAST -->
    <div id="toast" class="toast">✅ Card saved!</div>

    <script>
        // ==========================================
        // SIMPLE DATABASE
        // ==========================================
        const STORAGE_KEY = 'flashcards_minimal';

        function getCards() {
            try {
                const data = localStorage.getItem(STORAGE_KEY);
                return data ? JSON.parse(data) : [];
            } catch (e) {
                console.error("Error loading:", e);
                return [];
            }
        }

        function saveCards(cards) {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(cards));
                renderList();
                return true;
            } catch (e) {
                console.error("Error saving:", e);
                alert('❌ Failed to save! Error: ' + e.message);
                return false;
            }
        }

        // ==========================================
        // ADD CARD
        // ==========================================
        function addCard() {
            const front = document.getElementById('frontInput').value.trim();
            const back = document.getElementById('backInput').value.trim();

            if (!front || !back) {
                alert('⚠️ Please fill in both Front and Back!');
                return;
            }

            const cards = getCards();
            cards.push({
                id: Date.now(),
                front: front,
                back: back,
                createdAt: new Date().toISOString()
            });

            if (saveCards(cards)) {
                document.getElementById('frontInput').value = '';
                document.getElementById('backInput').value = '';
                showToast('✅ Card added!');
            }
        }

        // ==========================================
        // DELETE CARD
        // ==========================================
        function deleteCard(id) {
            if (!confirm('Delete this card?')) return;
            let cards = getCards().filter(c => c.id !== id);
            saveCards(cards);
            showToast('🗑️ Card deleted.');
        }

        // ==========================================
        // RENDER LIST
        // ==========================================
        function renderList() {
            const container = document.getElementById('cardList');
            const cards = getCards();

            if (cards.length === 0) {
                container.innerHTML = `<div class="empty-state">No cards yet. Add your first one above!</div>`;
                return;
            }

            let html = '';
            // Show newest first
            cards.slice().reverse().forEach(c => {
                html += `
                    <div class="card-item">
                        <div>
                            <span class="badge">#${cards.length - cards.indexOf(c)}</span>
                            <strong>${c.front}</strong> — ${c.back}
                            <small style="display:block; color:#6b7280; font-size:0.75rem; margin-top:4px;">
                                ${new Date(c.createdAt).toLocaleDateString()}
                            </small>
                        </div>
                        <button class="delete-btn" onclick="deleteCard(${c.id})">Delete</button>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        // ==========================================
        // TOAST NOTIFICATION
        // ==========================================
        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.classList.add('show');
            clearTimeout(toast._timeout);
            toast._timeout = setTimeout(() => {
                toast.classList.remove('show');
            }, 2500);
        }

        // ==========================================
        // INIT
        // ==========================================
        renderList();

        // Keyboard shortcut: Enter to save
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && (e.target.id === 'frontInput' || e.target.id === 'backInput')) {
                addCard();
            }
        });

        console.log('✅ Minimal flashcards loaded. Storage key:', STORAGE_KEY);
        console.log('📊 Current cards:', getCards());
    </script>

</body>
    </html>
