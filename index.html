<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TROVIRUSES</title>

    <!-- ===== CSS ===== -->
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
        }

        body {
            background: #000000;
            font-family: Arial, Helvetica, sans-serif;
            color: #ffffff;
            overflow-x: hidden;
        }

        body.sheet-open {
            overflow: hidden;
        }

        .app {
            width: 100%;
            max-width: 480px;
            min-height: 100vh;
            margin: 0 auto;
            position: relative;
            padding-bottom: 90px;
            background: #000000;
        }

        /* ===== SECTIONS ===== */
        .section {
            display: none;
            width: 100%;
            min-height: calc(100vh - 90px);
            background: #000000;
        }

        .section.active {
            display: block;
        }

        /* ===== BOTTOM NAV ===== */
        .bottom-nav-wrapper {
            position: fixed;
            left: 50%;
            bottom: 0;
            transform: translateX(-50%);
            width: 100%;
            max-width: 480px;
            padding: 8px 10px calc(8px + env(safe-area-inset-bottom));
            z-index: 1000;
            pointer-events: none;
        }

        .bottom-nav {
            width: 100%;
            min-height: 64px;
            display: flex;
            align-items: center;
            justify-content: space-around;
            gap: 4px;
            padding: 5px;
            background: #111111;
            border: 1px solid #252525;
            border-radius: 22px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.75);
            pointer-events: auto;
        }

        .nav-button {
            flex: 1;
            min-width: 0;
            height: 54px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            border: 0;
            border-radius: 16px;
            background: transparent;
            color: #888888;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            transition: background-color 0.2s ease, color 0.2s ease, transform 0.2s ease;
        }

        .nav-button:active {
            transform: scale(0.94);
        }

        .nav-button svg {
            width: 22px;
            height: 22px;
            fill: none;
            stroke: currentColor;
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
            transition: transform 0.2s ease;
        }

        .nav-button span {
            font-size: 10px;
            font-weight: 600;
            line-height: 1;
            white-space: nowrap;
        }

        .nav-button.active {
            background: #7c3aed;
            color: #ffffff;
            box-shadow: 0 0 18px rgba(124, 58, 237, 0.25);
        }

        .nav-button.active svg {
            transform: translateY(-1px);
        }

        /* ===== SHEET OVERLAY ===== */
        .sheet-overlay {
            position: fixed;
            inset: 0;
            z-index: 2000;
            background: rgba(0, 0, 0, 0.72);
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }

        .sheet-overlay.open {
            opacity: 1;
            visibility: visible;
        }

        /* ===== BOTTOM SHEET ===== */
        .bottom-sheet {
            position: absolute;
            left: 50%;
            bottom: 0;
            width: 100%;
            max-width: 480px;
            background: #111111;
            border: 1px solid #252525;
            border-bottom: 0;
            border-radius: 28px 28px 0 0;
            padding: 12px 18px calc(20px + env(safe-area-inset-bottom));
            box-shadow: 0 -10px 40px rgba(0, 0, 0, 0.75);
            transform: translate(-50%, 100%);
            transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1);
        }

        .sheet-overlay.open .bottom-sheet {
            transform: translate(-50%, 0);
        }

        .sheet-handle {
            width: 42px;
            height: 5px;
            margin: 0 auto 16px;
            background: #444444;
            border-radius: 999px;
        }

        .sheet-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
        }

        .sheet-title {
            font-size: 20px;
            font-weight: 700;
            color: #ffffff;
        }

        .sheet-close {
            width: 38px;
            height: 38px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid #292929;
            border-radius: 50%;
            background: #1a1a1a;
            color: #ffffff;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.2s ease;
        }

        .sheet-close:hover {
            background: #252525;
        }

        .sheet-close:active {
            transform: scale(0.92);
        }

        .sheet-close svg {
            width: 18px;
            height: 18px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
        }

        .sheet-menu {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .sheet-option {
            width: 100%;
            min-height: 54px;
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 0 16px;
            border: 1px solid #242424;
            border-radius: 16px;
            background: #1a1a1a;
            color: #ffffff;
            font-size: 15px;
            font-weight: 600;
            text-align: left;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.2s ease;
        }

        .sheet-option:hover {
            background: #222222;
        }

        .sheet-option:active {
            transform: scale(0.98);
        }

        .sheet-option svg {
            width: 21px;
            height: 21px;
            flex-shrink: 0;
            fill: none;
            stroke: #aaaaaa;
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .sheet-option.logout {
            color: #ff4d67;
        }

        .sheet-option.logout svg {
            stroke: #ff4d67;
        }

        /* ===== NOTES PAGE ===== */
        .notes-container {
            padding: 20px 16px;
        }

        .notes-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .notes-header h2 {
            font-size: 22px;
            font-weight: 700;
            color: #fff;
        }

        .btn-add-note {
            background: #7c3aed;
            border: none;
            color: #fff;
            padding: 10px 18px;
            border-radius: 30px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-add-note:hover {
            background: #6d28d9;
            transform: scale(1.02);
        }

        .note-item {
            background: #111111;
            border: 1px solid #252525;
            border-radius: 16px;
            padding: 14px 16px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: 0.2s;
        }

        .note-item:hover {
            border-color: #7c3aed;
        }

        .note-item .note-text {
            flex: 1;
            font-size: 15px;
            color: #eee;
            word-break: break-word;
        }

        .note-item .note-time {
            font-size: 11px;
            color: #666;
            white-space: nowrap;
        }

        .note-item .delete-note {
            background: transparent;
            border: none;
            color: #ff4d67;
            cursor: pointer;
            font-size: 18px;
            padding: 0 4px;
            transition: 0.2s;
        }

        .note-item .delete-note:hover {
            color: #ff1a3a;
            transform: scale(1.2);
        }

        /* ===== CYBERPUNK CHECKBOX ===== */
        .cyberpunk-checkbox {
            appearance: none;
            width: 20px;
            height: 20px;
            border: 2px solid #30cfd0;
            border-radius: 5px;
            background-color: transparent;
            display: inline-block;
            position: relative;
            flex-shrink: 0;
            cursor: pointer;
        }

        .cyberpunk-checkbox:before {
            content: "";
            background-color: #30cfd0;
            display: block;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            width: 10px;
            height: 10px;
            border-radius: 3px;
            transition: all 0.3s ease-in-out;
        }

        .cyberpunk-checkbox:checked:before {
            transform: translate(-50%, -50%) scale(1);
        }

        .cyberpunk-checkbox-label {
            font-size: 18px;
            color: #fff;
            cursor: pointer;
            user-select: none;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* ===== SEARCH ===== */
        .search-wrap {
            padding: 20px 16px 10px 16px;
            width: 100%;
            display: flex;
            justify-content: center;
        }

        #poda {
            position: relative;
            width: 100%;
            max-width: 400px;
        }

        .input {
            background-color: #010201;
            border: none;
            width: 100%;
            height: 56px;
            border-radius: 10px;
            color: white;
            padding-inline: 59px;
            font-size: 18px;
        }

        .input::placeholder {
            color: #c0b9c0;
        }

        .input:focus {
            outline: none;
        }

        #main {
            position: relative;
            width: 100%;
        }

        #search-icon {
            position: absolute;
            left: 20px;
            top: 15px;
        }

        #filter-icon {
            position: absolute;
            top: 8px;
            right: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2;
            max-height: 40px;
            max-width: 38px;
            height: 100%;
            width: 100%;
            isolation: isolate;
            overflow: hidden;
            border-radius: 10px;
            background: linear-gradient(180deg, #161329, black, #1d1b4b);
            border: 1px solid transparent;
        }

        .filterBorder {
            height: 42px;
            width: 40px;
            position: absolute;
            overflow: hidden;
            top: 7px;
            right: 7px;
            border-radius: 10px;
        }

        .filterBorder::before {
            content: "";
            text-align: center;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) rotate(90deg);
            position: absolute;
            width: 600px;
            height: 600px;
            background-repeat: no-repeat;
            background-position: 0 0;
            filter: brightness(1.35);
            background-image: conic-gradient(rgba(0, 0, 0, 0), #3d3a4f, rgba(0, 0, 0, 0) 50%, rgba(0, 0, 0, 0) 50%, #3d3a4f, rgba(0, 0, 0, 0) 100%);
            animation: rotate 4s linear infinite;
        }

        .glow,
        .darkBorderBg,
        .white,
        .border {
            position: absolute;
            border-radius: 12px;
            filter: blur(3px);
            z-index: -1;
            overflow: hidden;
        }

        .glow {
            filter: blur(30px);
            opacity: 0.4;
            width: 100%;
            height: 100%;
            max-height: 130px;
            max-width: 354px;
        }

        .glow::before {
            content: "";
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) rotate(60deg);
            width: 999px;
            height: 999px;
            background-image: conic-gradient(#000, #402fb5 5%, #000 38%, #000 50%, #cf30aa 60%, #000 87%);
            transition: all 2s;
        }

        @keyframes rotate {
            100% {
                transform: translate(-50%, -50%) rotate(450deg);
            }
        }

        /* ===== INFO CARDS ===== */
        .info-grid {
            display: flex;
            flex-direction: column;
            gap: 20px;
            padding: 16px;
        }

        .info-card {
            background: #0f0f12;
            border-radius: 20px;
            padding: 20px;
            border: 1px solid #1c1c22;
            transition: 0.2s;
        }

        .info-card:hover {
            border-color: #7c3aed;
        }

        .info-card .header {
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid #1c1c22;
            padding-bottom: 14px;
            margin-bottom: 14px;
        }

        .info-card .header .icon {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        .info-card .header .title {
            font-weight: 600;
            color: #eee;
        }

        .info-card .header .sub {
            font-size: 12px;
            color: #666;
        }

        .info-stats {
            display: flex;
            gap: 16px;
        }

        .info-stats .stat {
            flex: 1;
        }

        .info-stats .stat .label {
            font-size: 11px;
            color: #666;
            text-transform: uppercase;
        }

        .info-stats .stat .value {
            font-size: 22px;
            font-weight: 700;
            color: #fff;
        }

        .info-stats .stat .change {
            font-size: 12px;
            font-weight: 600;
        }

        .change.positive {
            color: #a3e635;
        }
        .change.negative {
            color: #f87171;
        }

        .progress-bar {
            width: 100%;
            height: 4px;
            background: #1c1c22;
            border-radius: 4px;
            margin-top: 12px;
            overflow: hidden;
        }

        .progress-bar .fill {
            height: 100%;
            border-radius: 4px;
            background: linear-gradient(90deg, #7c3aed, #a3e635);
            transition: width 0.6s ease;
        }

        /* ===== RESPONSIVE ===== */
        @media (min-width: 481px) {
            body {
                background: #000000;
            }

            .bottom-nav-wrapper {
                bottom: 12px;
            }

            .bottom-sheet {
                border-bottom: 1px solid #252525;
                border-radius: 28px;
                bottom: 12px;
            }

            .sheet-overlay {
                display: flex;
                align-items: flex-end;
                justify-content: center;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .nav-button,
            .nav-button svg,
            .sheet-overlay,
            .bottom-sheet,
            .sheet-close,
            .sheet-option,
            .filterBorder::before,
            .glow::before {
                transition: none;
                animation: none;
            }
        }
    </style>
</head>

<body>

    <div class="app">

        <!-- ===== SECTIONS ===== -->
        <main>
            <section id="worlds" class="section" aria-hidden="true"></section>
            <section id="others" class="section" aria-hidden="true"></section>
            <section id="home" class="section active" aria-hidden="false">
                <!-- جستجوگر -->
                <div class="search-wrap">
                    <div id="poda">
                        <div class="glow"></div>
                        <div class="darkBorderBg"></div>
                        <div class="darkBorderBg"></div>
                        <div class="darkBorderBg"></div>
                        <div class="white"></div>
                        <div class="border"></div>
                        <div id="main">
                            <input placeholder="Search..." type="text" name="text" class="input" />
                            <div id="input-mask"></div>
                            <div id="pink-mask"></div>
                            <div class="filterBorder"></div>
                            <div id="filter-icon">
                                <svg preserveAspectRatio="none" height="27" width="27" viewBox="4.8 4.56 14.832 15.408" fill="none">
                                    <path d="M8.16 6.65002H15.83C16.47 6.65002 16.99 7.17002 16.99 7.81002V9.09002C16.99 9.56002 16.7 10.14 16.41 10.43L13.91 12.64C13.56 12.93 13.33 13.51 13.33 13.98V16.48C13.33 16.83 13.1 17.29 12.81 17.47L12 17.98C11.24 18.45 10.2 17.92 10.2 16.99V13.91C10.2 13.5 9.97 12.98 9.73 12.69L7.52 10.36C7.23 10.08 7 9.55002 7 9.20002V7.87002C7 7.17002 7.52 6.65002 8.16 6.65002Z" stroke="#d6d6e6" stroke-width="1" stroke-miterlimit="10" stroke-linecap="round" stroke-linejoin="round"></path>
                                </svg>
                            </div>
                            <div id="search-icon">
                                <svg xmlns="http://www.w3.org/2000/svg" width="24" viewBox="0 0 24 24" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" height="24" fill="none">
                                    <circle stroke="url(#search)" r="8" cy="11" cx="11"></circle>
                                    <line stroke="url(#searchl)" y2="16.65" y1="22" x2="16.65" x1="22"></line>

                                        </linearGradient>
                                        <linearGradient id="searchl">
                                            <stop stop-color="#b6a9b7" offset="0%"></stop>
                                            <stop stop-color="#837484" offset="50%"></stop>
                                        </linearGradient>
                                    </defs>
                                </svg>
                            </div>
                        </div>
                    </div>
                </div>
                <div style="padding: 0 16px; color: #666; text-align: center; font-size: 14px;">
                    🔍 Search cards, words & categories
                </div>
            </section>

            <!-- ===== INFO PAGE ===== -->
            <section id="info" class="section" aria-hidden="true">
                <div class="info-grid" id="infoGrid">
                    <!-- کارت‌ها توسط JS ساخته می‌شوند -->
                </div>
            </section>
