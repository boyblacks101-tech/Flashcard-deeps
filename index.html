<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AnkiPro — Smart Flashcards</title>
    <!-- Font & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz@14..32&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: #0b0d14;
            color: #eef2f6;
            min-height: 100vh;
            background-size: cover;
            background-position: center;
            transition: background-image 0.7s ease;
        }
        #bgVideo {
            position: fixed; top:0; left:0; width:100%; height:100%;
            object-fit:cover; z-index:-2; display:none;
        }
        .bg-overlay {
            position: fixed; top:0; left:0; width:100%; height:100%;
            background: rgba(11,13,20,0.75);
            backdrop-filter:blur(3px); z-index:-1;
        }
        ::-webkit-scrollbar { width:5px; }
        ::-webkit-scrollbar-track { background:#1a1e2a; }
        ::-webkit-scrollbar-thumb { background:#4f46e5; border-radius:10px; }

        /* ---- SIDEBAR ---- */
        .offcanvas {
            background: rgba(16,20,32,0.96);
            backdrop-filter: blur(20px);
            border-right:1px solid rgba(255,255,255,0.06);
            width:270px; color:#b0b8cf;
        }
        .offcanvas .btn-close { filter:invert(1) brightness(2); }
        .brand {
            font-size:1.6rem; font-weight:700;
            background:linear-gradient(135deg,#818cf8,#4f46e5);
            -webkit-background-clip:text; -webkit-text-fill-color:transparent;
            padding:20px 0 12px 0; border-bottom:1px solid rgba(255,255,255,0.05);
        }
        .nav-item {
            display:flex; align-items:center; gap:14px;
            padding:12px 16px; margin:4px 10px;
            border-radius:12px; color:#9aa3b8; font-weight:500;
            text-decoration:none; transition:0.2s;
        }
        .nav-item i { font-size:1.3rem; width:26px; }
        .nav-item:hover, .nav-item.active {
            background:rgba(79,70,229,0.2); color:#fff; transform:translateX(4px);
        }

        /* ---- GLASS PANEL ---- */
        .glass {
            background: rgba(22,28,44,0.7);
            backdrop-filter: blur(14px);
            border:1px solid rgba(255,255,255,0.06);
            border-radius:28px;
            padding:28px 24px;
            box-shadow:0 20px 50px -10px rgba(0,0,0,0.8);
        }
        .stat-box {
            background:rgba(255,255,255,0.03);
            border-radius:18px; padding:18px 12px;
            border:1px solid rgba(255,255,255,0.04);
            text-align:center;
        }
        .stat-number {
            font-size:2.6rem; font-weight:700;
            background:linear-gradient(135deg,#a5b4fc,#4f46e5);
            -webkit-background-clip:text; -webkit-text-fill-color:transparent;
        }

        .btn-pro {
            padding:10px 28px; border-radius:60px; border:none;
            font-weight:600; transition:0.25s;
            background:rgba(255,255,255,0.06);
            color:#fff; border:1px solid rgba(255,255,255,0.08);
        }
        .btn-pro:hover { background:rgba(255,255,255,0.14); transform:scale(1.02); }
        .btn-primary { background:#4f46e5; border-color:#4f46e5; }
        .btn-primary:hover { background:#6366f1; }
        .btn-success { background:#059669; border-color:#059669; }
        .btn-success:hover { background:#10b981; }
        .btn-danger { background:#dc2626; border-color:#dc2626; }
        .btn-danger:hover { background:#ef4444; }

        .form-control, .form-select {
            background:rgba(255,255,255,0.05);
            border:1px solid rgba(255,255,255,0.08);
            border-radius:16px; color:#fff; padding:12px 18px;
        }
        .form-control:focus, .form-select:focus {
            background:rgba(255,255,255,0.09);
            border-color:#4f46e5;
            box-shadow:0 0 0 4px rgba(79,70,229,0.2);
            color:#fff;
        }
        .form-control::placeholder { color:rgba(255,255,255,0.3); }

        /* ---- FLIP CARD ---- */
        .flip-wrap {
            perspective:1000px; min-height:260px; cursor:pointer;
        }
        .flipper {
            position:relative; width:100%; min-height:260px;
            transition:transform 0.5s cubic-bezier(0.23,1,0.32,1);
            transform-style:preserve-3d;
        }
        .flip-wrap.flipped .flipper { transform:rotateX(180deg); }
        .front, .back {
            position:absolute; width:100%; min-height:260px;
            backface-visibility:hidden; border-radius:24px;
            padding:30px 20px; display:flex; flex-direction:column;
            justify-content:center; align-items:center; text-align:center;
            background:rgba(30,36,54,0.85); backdrop-filter:blur(8px);
            border:1px solid rgba(255,255,255,0.06);
        }
        .back { transform:rotateX(180deg); background:rgba(79,70,229,0.15); }

        .badge-type {
            background:rgba(79,70,229,0.3); color:#a5b4fc;
            padding:4px 14px; border-radius:40px; font-size:0.7rem; font-weight:600;
        }
        .list-item {
            background:rgba(255,255,255,0.02);
            border-radius:14px; padding:14px 18px; margin-bottom:8px;
            border-left:3px solid #4f46e5;
            display:flex; justify-content:space-between; align-items:center;
            transition:0.2s;
        }
        .list-item:hover { background:rgba(255,255,255,0.05); }
        .timer-bar {
            height:3px; background:rgba(255,255,255,0.06);
            border-radius:4px; overflow:hidden; margin-bottom:18px;
        }
        .timer-bar span {
            display:block; height:100%; width:0%;
            background:linear-gradient(90deg,#4f46e5,#06b6d4);
            transition:width 0.5s linear;
        }
        .review-btns .btn {
            border-radius:60px; padding:12px 26px; font-weight:700; min-width:80px;
        }
        .toast-container { z-index:9999; }
        .toast-custom {
            background:rgba(20,26,42,0.95) !important;
            backdrop-filter:blur(16px);
            border:1px solid rgba(255,255,255,0.06);
            color:#fff; border-radius:16px;
        }
        @media(max-width:576px) {
            .glass { padding:16px; }
            .stat-number { font-size:1.8rem; }
        }
    </style>
</head>
<body>

    <video id="bgVideo" autoplay muted loop playsinline></video>
    <div class="bg-overlay"></div>

    <div class="toast-container position-fixed bottom-0 end-0 p-3"></div>

    <!-- ===== SIDEBAR ===== -->
    <div class="offcanvas offcanvas-start" tabindex="-1" id="mainSidebar">
        <div class="offcanvas-header border-bottom border-white border-opacity-10">
            <div class="brand"><i class="bi bi-brain"></i> AnkiPro</div>
            <button type="button" class="btn-close" data-bs-dismiss="offcanvas"></button>
        </div>
        <div class="offcanvas-body p-0 pt-3">
            <nav class="nav flex-column">
                <a class="nav-item active" href="#" onclick="navigateTo('home')"><i class="bi bi-grid-1x2-fill"></i> Dashboard</a>
                <a class="nav-item" href="#" onclick="navigateTo('review')"><i class="bi bi-arrow-repeat"></i> Review Today</a>
                <a class="nav-item" href="#" onclick="navigateTo('add')"><i class="bi bi-plus-circle"></i> New Card</a>
                <a class="nav-item" href="#" onclick="navigateTo('list')"><i class="bi bi-table"></i> Card List</a>
                <a class="nav-item" href="#" onclick="navigateTo('settings')"><i class="bi bi-sliders2"></i> Settings</a>
                <div class="border-top border-white border-opacity-10 my-3"></div>
                <a class="nav-item" href="#" onclick="exportData()"><i class="bi bi-download"></i> Export Backup</a>
                <a class="nav-item" href="#" onclick="document.getElementById('importFile').click()"><i class="bi bi-upload"></i> Import Backup</a>
                <input type="file" id="importFile" accept=".json" style="display:none" onchange="importData(event)">
                <a class="nav-item" href="#" onclick="manualBackup()"><i class="bi bi-save"></i> Manual Backup</a>
            </nav>
        </div>
    </div>

    <!-- ===== MAIN ===== -->
    <div class="container py-4" style="max-width:1100px;">
        <!-- Header -->
        <div class="d-flex justify-content-between align-items-center mb-3">
            <div>
                <h1 class="text-white fw-bold fs-2"><i class="bi bi-stars text-primary"></i> AnkiPro</h1>
                <small class="text-secondary">v2.2 · Spaced Repetition Engine</small>
            </div>
            <button class="btn btn-pro" data-bs-toggle="offcanvas" data-bs-target="#mainSidebar">
                <i class="bi bi-list fs-4"></i>
            </button>
        </div>

        <div class="timer-bar"><span id="bgProgressBar"></span></div>

        <!-- ===== HOME ===== -->
        <div id="page-home">
            <div class="glass">
                <div class="row g-3 mb-4">
                    <div class="col-6 col-md-3"><div class="stat-box"><div class="stat-number" id="statTotal">0</div><small class="text-secondary">Total</small></div></div>
                    <div class="col-6 col-md-3"><div class="stat-box"><div class="stat-number" id="statDue">0</div><small class="text-secondary">Due Today</small></div></div>
                    <div class="col-6 col-md-3"><div class="stat-box"><div class="stat-number" id="statReviews">0</div><small class="text-secondary">Reviews</small></div></div>
                    <div class="col-6 col-md-3"><div class="stat-box"><div class="stat-number" id="statTypes">3</div><small class="text-secondary">Types</small></div></div>
                </div>
                <div class="text-center">
                    <button class="btn btn-primary btn-pro btn-lg px-5" onclick="navigateTo('review')">
                        <i class="bi bi-play-fill"></i> Start Review
                    </button>
                    <p class="text-secondary mt-2 small" id="homeSub">Ready to learn?</p>
                </div>
            </div>
        </div>

        <!-- ===== REVIEW ===== -->
        <div id="page-review" style="display:none;">
            <div class="glass" id="reviewContainer">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h4><i class="bi bi-arrow-repeat text-success"></i> Review</h4>
                    <span id="reviewProgress" class="badge bg-light text-dark px-3 py-2">0/0</span>
                </div>
                <div id="reviewCardArea">
                    <div class="text-center py-5">
                        <i class="bi bi-check-circle-fill text-success" style="font-size:4rem;"></i>
                        <h4 class="mt-3">All done!</h4>
                        <p class="text-secondary">No cards due today.</p>
                        <button class="btn btn-pro mt-3" onclick="navigateTo('home')">Dashboard</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- ===== ADD ===== -->
        <div id="page-add" style="display:none;">
            <div class="glass">
                <h4><i class="bi bi-plus-circle-fill text-success"></i> New Card</h4>
                <hr class="border-light border-opacity-10">
                <div class="mb-3">
                    <label class="form-label text-secondary">Type</label>
                    <select id="cardType" class="form-select" onchange="changeFields()">
                        <option value="normal">📝 Standard</option>
                        <option value="coding">💻 Coding & Security</option>
                        <option value="spanish">🇪🇸 Spanish</option>
                    </select>
                </div>
                <div id="fieldsMain">
                    <div class="mb-2"><input id="f_front" class="form-control" placeholder="Front (Question)"></div>
                    <div class="mb-2"><input id="f_back" class="form-control" placeholder="Back (Answer)"></div>
                </div>
                <div id="fieldsExtra" style="display:none;"></div>
                <button class="btn btn-success btn-pro w-100 mt-3" onclick="addCard()"><i class="bi bi-save"></i> Save</button>
                <div id="debugMsg" class="mt-2 small text-warning" style="display:none;"></div>
            </div>
        </div>

        <!-- ===== LIST ===== -->
        <div id="page-list" style="display:none;">
            <div class="glass">
                <h4><i class="bi bi-table"></i> Card List</h4>
                <hr class="border-light border-opacity-10">
                <input id="searchInput" class="form-control mb-3" placeholder="🔍 Search..." oninput="renderList()">
                <div id="cardListContainer"></div>
            </div>
        </div>

        <!-- ===== SETTINGS ===== -->
        <div id="page-settings" style="display:none;">
            <div class="glass">
                <h4><i class="bi bi-sliders2"></i> Settings</h4>
                <hr class="border-light border-opacity-10">
                <div class="mb-3">
                    <label class="form-label text-secondary">🖼️ Background (image or .mp4)</label>
                    <div class="input-group">
                        <input id="bgUrl" class="form-control" placeholder="https://..." value="https://images.unsplash.com/photo-1534796636912-3b95b3ab5986?w=800">
                        <button class="btn btn-primary btn-pro" onclick="applyBg()">Apply</button>
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label text-secondary">⏱️ Rotate every (minutes)</label>
                    <input id="bgInterval" type="number" class="form-control" value="1.5" min="0.5" step="0.5">
                </div>
                <hr>
                <button class="btn btn-danger btn-pro me-2" onclick="if(confirm('Delete all cards?')){localStorage.removeItem('ap_cards');updateStats();renderList();showToast('All data cleared.');}"><i class="bi bi-trash"></i> Clear All</button>
                <button class="btn btn-pro" onclick="restoreBackup()"><i class="bi bi-arrow-counterclockwise"></i> Restore Backup</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // ============================================================
        // CORE — WORKING ENGINE (tested)
        // ============================================================
        const KEY = 'ap_cards';
        const BACKUP_KEY = 'ap_backup';

        function getCards() {
            try { return JSON.parse(localStorage.getItem(KEY)) || []; } catch { return []; }
        }
        function saveCards(cards) {
            if (!Array.isArray(cards)) throw new Error('Invalid data');
            localStorage.setItem(KEY, JSON.stringify(cards));
            localStorage.setItem(BACKUP_KEY, JSON.stringify(cards));
            updateStats();
            renderList();
        }

        // ============================================================
        // UI HELPERS
        // ============================================================
        function showToast(msg) {
            const c = document.querySelector('.toast-container');
            const t = document.createElement('div');
            t.className = 'toast align-items-center text-white border-0 show toast-custom';
            t.innerHTML = `<div class="d-flex"><div class="toast-body">${msg}</div><button class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button></div>`;
            c.appendChild(t);
            setTimeout(() => t.remove(), 4000);
        }

        function updateStats() {
            const cards = getCards();
            document.getElementById('statTotal').textContent = cards.length;
            const today = new Date().toISOString().split('T')[0];
            const due = cards.filter(c => (c.nextDate || today) <= today).length;
            document.getElementById('statDue').textContent = due;
            const rev = cards.reduce((s, c) => s + (c.reviewCount || 0), 0);
            document.getElementById('statReviews').textContent = rev;
            const sub = document.getElementById('homeSub');
            sub.textContent = due ? `🔥 ${due} card(s) due today` : '🎉 All caught up!';
        }

        function navigateTo(page) {
            ['home','review','add','list','settings'].forEach(p => {
                document.getElementById('page-'+p).style.display = (p===page) ? 'block' : 'none';
            });
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            const map = {home:0, review:1, add:2, list:3, settings:4};
            const items = document.querySelectorAll('.nav-item');
            if (map[page] !== undefined && items[map[page]]) items[map[page]].classList.add('active');
            if (page === 'home') updateStats();
            if (page === 'list') renderList();
            if (page === 'review') startReview();
            try { bootstrap.Offcanvas.getInstance(document.getElementById('mainSidebar'))?.hide(); } catch(e) {}
        }

        // ============================================================
        // ADD CARD — WORKS
        // ============================================================
        function changeFields() {
            const type = document.getElementById('cardType').value;
            const extra = document.getElementById('fieldsExtra');
            if (type === 'coding') {
                extra.innerHTML = `<div class="mb-2"><input id="f_code" class="form-control" placeholder="💻 Code Snippet"></div>
                                   <div class="mb-2"><input id="f_hint" class="form-control" placeholder="🔐 Security Hint"></div>`;
                extra.style.display = 'block';
            } else if (type === 'spanish') {
                extra.innerHTML = `<div class="mb-2"><input id="f_pron" class="form-control" placeholder="🔊 Pronunciation"></div>
                                   <div class="mb-2"><input id="f_example" class="form-control" placeholder="📝 Example Sentence"></div>`;
                extra.style.display = 'block';
            } else { extra.style.display = 'none'; }
        }

        function addCard() {
            const debug = document.getElementById('debugMsg');
            debug.style.display = 'none';
            try {
                const type = document.getElementById('cardType').value;
                const front = document.getElementById('f_front').value.trim();
                const back = document.getElementById('f_back').value.trim();
                if (!front || !back) { alert('Fill both fields!'); return; }

                let card = {
                    id: Date.now(),
                    type,
                    front,
                    back,
                    interval: 0,
                    ease: 2.5,
                    reps: 0,
                    reviewCount: 0,
                    nextDate: new Date().toISOString().split('T')[0]
                };
                if (type === 'coding') {
                    card.code = document.getElementById('f_code')?.value || '';
                    card.hint = document.getElementById('f_hint')?.value || '';
                } else if (type === 'spanish') {
                    card.pron = document.getElementById('f_pron')?.value || '';
                    card.example = document.getElementById('f_example')?.value || '';
